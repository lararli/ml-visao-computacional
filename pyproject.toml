[project]
name = "visaocomp"
version = "0.1.0"
description = "Visão computacional com CNNs e Transformers (Infnet): A1 a A4."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "transformers>=4.46",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pillow>=10.4",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "imagehash>=4.3",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "torchmetrics[image]>=1.5",
    "xhtml2pdf>=0.2.16",
    "markdown>=3.7",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visaocomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: pipeline minúsculo, sem rede",
    "data: precisa de data.nosync/ já baixado",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
